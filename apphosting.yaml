runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: ASAAS_API_KEY
    secret: asaas-api-key
  - variable: ASAAS_WEBHOOK_TOKEN
    secret: asaas-webhook-token
  - variable: ASAAS_BASE_URL
    value: https://api.asaas.com/api/v3
