buildCommand: npm run build

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  timeoutSeconds: 3600
  startupCpuBoost: true

env:
  - variable: NODE_ENV
    value: production
  - variable: VITE_META_PIXEL_ID
    value: "1541685420840320"
  - variable: META_CONVERSIONS_API_TOKEN
    secret: meta-conversions-api-token
  - variable: VITE_TIKTOK_PIXEL_ID
    value: "D9GCICRC77UBS5FSLDFG"
  - variable: TIKTOK_ACCESS_TOKEN
    secret: tiktok-access-token
  - variable: ASAAS_API_KEY
    secret: asaas-api-key
  - variable: ASAAS_WEBHOOK_TOKEN
    secret: asaas-webhook-token
  - variable: ASAAS_BASE_URL
    value: https://api.asaas.com/v3
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
  - variable: CONTENT_CRON_SECRET
    secret: content-cron-secret

  # Tiny ERP (Olist) — API v3, OAuth2. O client_secret NÃO fica aqui; o campo
  # `secret:` referencia o nome do secret no Secret Manager (tiny-client-secret).
  - variable: TINY_CLIENT_ID
    value: "tiny-api-5e4a4723ff9b577c8967b4cd2179f2deb20bad26-1783971027"
  - variable: TINY_REDIRECT_URI
    value: "https://alfreds--project-95918f0d-50bb-4f66-a0d.us-east4.hosted.app/api\
      /tiny/oauth/callback"
  - variable: TINY_CLIENT_SECRET
    secret: tiny-client-secret

  # CRM admin (/admin). Allowlist de bootstrap do acesso — resolve o ovo-e-galinha
  # do custom claim, que só pode ser concedido com uma service account.
  - variable: ADMIN_EMAILS
    value: "rafaelscala@hotmail.com"

  # WhatsApp Oficial (Meta Cloud API) — régua de onboarding por etapa do Kanban.
  # Sem estas variáveis o CRM funciona inteiro; só a automação fica inerte.
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: whatsapp-access-token
  - variable: WHATSAPP_PHONE_NUMBER_ID
    secret: whatsapp-phone-number-id
  - variable: WHATSAPP_WABA_ID
    secret: whatsapp-waba-id
  # Teto de envios por rodada — trava contra disparo em massa por bug.
  - variable: WHATSAPP_MAX_PER_DAY
    value: "50"
  # Começa em "true": a régua roda inteira e registra os envios SEM chamar a
  # Meta. Vire para "false" só depois de conferir que os disparos fazem sentido.
  - variable: WHATSAPP_DRY_RUN
    value: "true"
